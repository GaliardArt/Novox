name: Windows Build, Tests and Package

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          git --version

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create install layout
        run: cmake --install build --config Release --prefix dist

      - name: Create portable ZIP
        run: cpack --config build/CPackConfig.cmake -C Release -B build

      - name: Verify portable ZIP exists
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem build -Filter "NOVOX-*-Windows-x64.zip" -File)
          if ($packages.Count -ne 1) {
            Get-ChildItem build -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Expected exactly one NOVOX Windows x64 ZIP in build; found $($packages.Count)."
          }
          Write-Host "Package ready: $($packages[0].FullName)"

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: NOVOX-Windows-x64-${{ github.sha }}
          path: build/NOVOX-*-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
